# PR と作業ブランチ（tskf/*）のチェック。本番には触らない。
# 型は tskf の再利用可能ワークフロー（01-operations/playbooks/infra/dev-flow.md）
name: CI
on:
  pull_request:
  push:
    branches: ["tskf/**"]
jobs:
  ci:
    uses: bytask/tskf/.github/workflows/worker-ci.yml@main
    with:
      wrangler_types: false
      typecheck: npm run typecheck
      test: npm test
      dry_run: false
