# PR と作業ブランチ（tskf/*）のチェック。本番には触らない。
# 公開 repo は private repo（bytask/tskf）の再利用可能ワークフローを呼べないので、
# 型（tskf 01-operations/playbooks/infra/dev-flow.md）を写してある。直すときは両方。
name: CI
on:
  pull_request:
  push:
    branches: ["tskf/**"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
